# Local end-to-end run. AI plane runs in stub mode unless cloud creds are set,
# so the whole governed workflow is demonstrable with zero cloud spend.
services:
  ai-plane:
    build: ../python-ai
    ports: ["8000:8000"]
    env_file: ../python-ai/.env.example

  control-plane:
    build: ../java-core
    ports: ["8080:8080"]
    environment:
      AI_PLANE_URL: http://ai-plane:8000
    depends_on: [ai-plane]
